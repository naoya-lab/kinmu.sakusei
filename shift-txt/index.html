<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12365c"><title>シフト連絡→TXT</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#18304b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#12365c;color:white;padding:22px 16px}h1{font-size:22px;margin:0 0 6px}header p{margin:0;font-size:13px;color:#c9dbea}main{max-width:760px;margin:auto;padding:16px}section{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px #0001}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:14px;font-weight:650;margin:12px 0 5px}input,textarea,button{font:inherit}input[type=text],textarea{width:100%;border:1px solid #b8c8d9;border-radius:8px;padding:10px;font-size:15px}textarea{min-height:78px;resize:vertical;line-height:1.5}.small{color:#627487;font-size:12px;line-height:1.7}.primary{background:#1766ae;color:#fff;border:0;border-radius:9px;padding:12px 16px;font-weight:700}button{cursor:pointer}.secondary{border:1px solid #abc0d5;background:white;border-radius:9px;padding:11px 15px;color:#174d79}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.metric{background:#edf4fb;padding:10px;border-radius:8px;font-size:13px}#preview{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:13px}#status{font-size:13px;margin:10px 0}progress{width:100%}img{max-width:100%;max-height:220px;object-fit:contain;margin:8px 0;border-radius:8px} .hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:480px){.grid{grid-template-columns:1fr}} </style></head>
<body><header><h1>シフト連絡 → TXT</h1><p>画像の文字を読み取り、9月25日形式のシフト調整報告を作成</p></header>
<main>
<section><h2>1. スクリーンショットを選択</h2>
<input id="pics" type="file" accept="image/*" multiple>
<div id="thumbs"></div><p class="small">複数画像に対応。画像は外部サーバーへアップロードしません。文字認識の初回利用時は認識ライブラリと日本語辞書をネットワークから取得します。</p>
<div class="actions"><button id="ocr" class="primary">画像から文字を読み取る</button><button id="clear" class="secondary">入力を初期化</button></div><p id="status" role="status">画像を選択してください。</p><progress id="prog" max="100" value="0" class="hidden"></progress>
<label for="raw">読み取った文字（手入力・貼付も可能）</label><textarea id="raw" rows="7" placeholder="LINE WORKSの文章を貼り付けても利用できます"></textarea>
<div class="actions"><button id="parse" class="secondary">文字から項目を抽出</button></div>
</section>
<section><h2>2. 項目を確認・修正</h2><p class="small">認識ミスがあるため必ず元画像と比較してください。画像にない情報は自動補完しません。</p>
<label>日付</label><input id="date" type="text" placeholder="9月25日(金)">
<label>1) 夜勤者・前日時間外勤務・呼出等</label><textarea id="night" placeholder="夜勤者名・件数・前日時間外勤務など"></textarea>
<label>2) タスク共有事項</label><textarea id="tasks" placeholder="特になし 等"></textarea>
<label>3) 取込当番</label><textarea id="duty" placeholder="Gr.、班、担当者"></textarea>
<label>4) 本日シフト調整：件数</label><textarea id="counts" rows="11" placeholder="・外科Image ..."></textarea>
<label>配置変更・追加連絡</label><textarea id="changes" rows="5" placeholder="氏名　元配置→新配置"></textarea>
<label>5) 指導監</label><textarea id="guidance" rows="4"></textarea>
<label>6) 会議・その他</label><textarea id="meeting" rows="4"></textarea>
<label>朝ブリーフィング担当（追加項目・任意）</label><input id="brief" type="text">
<label>グループ一覧（任意）</label><textarea id="groups" rows="3" placeholder="Gr.A ..."></textarea>
</section>
<section><h2>3. TXTファイルを生成</h2><div class="actions"><button class="primary" id="generate">TXTを更新</button><button class="secondary" id="download">TXTを保存</button><button class="secondary" id="copy">全文をコピー</button></div>
<label for="preview">出力プレビュー（直接編集可）</label><textarea id="preview" rows="24"></textarea><p class="small">文字コードUTF-8、改行LF。元のTXTに近い6区分形式で出力します。プレビューを変更した場合はその内容で保存します。</p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
'use strict';
const ids=['date','night','tasks','duty','counts','changes','guidance','meeting','brief','groups'];
const $=id=>document.getElementById(id);
const labels=['外科Image','MG','透視','DXA','AG','心カテ','CT','PET','RI','MRI'];
function normalize(s){return s.replace(/\r/g,'').replace(/[　]/g,' ').replace(/[→➔➡]/g,'→').replace(/[：]/g,':').replace(/[（]/g,'(').replace(/[）]/g,')').replace(/^[・•･\s]+/,'').trim()}
function matchLine(s,label){const t=normalize(s);if(label==='CT')return /^CT(?:\s|:|[0-9０-９])/.test(t);if(label==='RI')return /^RI(?:\s|:|[0-9０-９])/.test(t);if(label==='MG')return /^MG(?:\s|:|[0-9０-９])/.test(t);return t.toUpperCase().startsWith(label.toUpperCase()+' ')||t.toUpperCase().startsWith(label.toUpperCase()+':')||t.toUpperCase().startsWith(label.toUpperCase()+'　')||new RegExp('^'+label+'[0-9０-９]').test(t)}
function parse(){const input=$('raw').value;const lines=input.split('\n').map(normalize).filter(Boolean);const date=lines.find(l=>/(?:\d{1,2})月\s*(?:\d{1,2})日/.test(l));if(date){const m=date.match(/\d{1,2}月\s*\d{1,2}日(?:\s*\([月火水木金土日]\))?/);if(m)$('date').value=m[0];}
const found={};let last='';const changes=[];
for(const l of lines){let type=labels.find(k=>matchLine(l,k));if(type){found[type]='・'+l;last=type;continue}
if(last==='CT'&&/^(件|冠動脈|心臓)/.test(l)){found.CT+=l;continue}
last='';
if(/→/.test(l)&&/(?:技師|主査|主幹|副技師長|主任|管理補佐)/.test(l))changes.push(l);
}
const rows=labels.map(k=>found[k]||'・'+k+'　【未確認】');
$('counts').value=rows.join('\n');$('changes').value=changes.join('\n');
const brief=lines.find(l=>/朝ブリーフィング担当/.test(l));if(brief)$('brief').value=brief.replace(/.*朝ブリーフィング担当\s*[:：]?\s*/,'').trim();
generate();$('status').textContent='件数 '+Object.keys(found).length+'/10 項目を検出しました。未確認項目をチェックしてください。';
}
function field(id){return $(id).value.trim()||'【未入力】'}
function generate(){const out=[field('date'),'','1)夜勤者・前日時間外勤務・呼出等',field('night'),'','2)タスク共有事項',field('tasks'),'','3)取込当番',field('duty'),'','4)本日シフト調整',field('counts'),'','配置変更・追加連絡',field('changes'),'','5)指導監',field('guidance'),'','6)会議・その他',field('meeting')];if($('brief').value.trim())out.push('','朝ブリーフィング担当：'+$('brief').value.trim());if($('groups').value.trim())out.push('','グループ一覧',field('groups'));$('preview').value=out.join('\n')+'\n';}
$('generate').onclick=generate;$('parse').onclick=parse;
$('pics').onchange=()=>{const f=[...$('pics').files];$('thumbs').replaceChildren();for(const file of f){const im=new Image();im.src=URL.createObjectURL(file);im.onload=()=>URL.revokeObjectURL(im.src);im.alt=file.name;$('thumbs').append(im)}$('status').textContent=f.length+'枚を選択しました。';};
$('ocr').onclick=async()=>{const files=[...$('pics').files];if(!files.length){$('status').textContent='先に画像を選んでください。';return}if(typeof Tesseract==='undefined'){$('status').textContent='文字認識ライブラリの読み込みに失敗。ネット接続を確認するか文章を貼り付けてください。';return}
$('ocr').disabled=true;$('prog').classList.remove('hidden');$('prog').value=0;let worker;try{worker=await Tesseract.createWorker('jpn',1,{logger:m=>{if(m.progress)$('prog').value=Math.round(m.progress*100);$('status').textContent='認識中：'+(m.status||'')+' '+Math.round((m.progress||0)*100)+'%'}});const pieces=[];for(let i=0;i<files.length;i++){ $('status').textContent=(i+1)+'/'+files.length+'枚目を認識しています';const res=await worker.recognize(files[i]);pieces.push(res.data.text)}$('raw').value=pieces.join('\n\n');parse()}catch(e){$('status').textContent='認識できませんでした：'+(e.message||e)}finally{if(worker)await worker.terminate();$('ocr').disabled=false;$('prog').classList.add('hidden')}};
$('download').onclick=()=>{if(!$('preview').value.trim())generate();const text=$('preview').value;const m=$('date').value.match(/(\d+)月\s*(\d+)日/);const fname=m?'シフト調整_'+m[1]+'月'+m[2]+'日.txt':'シフト調整.txt';const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)};
$('copy').onclick=async()=>{if(!$('preview').value.trim())generate();try{await navigator.clipboard.writeText($('preview').value);$('status').textContent='TXTをコピーしました'}catch(e){$('status').textContent='コピーできません。プレビューを選択してコピーしてください'}};
$('clear').onclick=()=>{if(!confirm('入力内容をすべて消去しますか？'))return;ids.forEach(id=>$(id).value='');$('raw').value='';$('preview').value='';$('pics').value='';$('thumbs').replaceChildren();$('status').textContent='初期化しました'};
generate();
</script></body></html>
